name: build mkdocs
on:
  push:
    branches:
      - brothel
jobs:
  build-mkdocs:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2
        with:
           fetch-depth: 0
      - name: mkdocs
        uses: mhausenblas/mkdocs-deploy-gh-pages@1.26
        env:
           REQUIREMENTS: requirements.txt
           CUSTOM_DOMAIN: docs.hooker.dev
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
